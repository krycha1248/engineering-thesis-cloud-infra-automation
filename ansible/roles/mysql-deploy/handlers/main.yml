- name: Autostart mysql
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true
- name: Autostart apache2
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
- name: Restart apache2
  ansible.builtin.service:
    name: apache2
    state: restarted
    enabled: true
...